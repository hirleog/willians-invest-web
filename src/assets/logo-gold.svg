<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DEB0" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F8E5BA" />
      <stop offset="75%" stop-color="#B88A44" />
      <stop offset="100%" stop-color="#E5C78A" />
    </linearGradient>
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="lineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Stylized Monogram W -->
  <g transform="translate(300, 58)" filter="url(#goldGlow)">
    <!-- Left outer serif & diagonal -->
    <path d="M -60 -42 L -38 -42 L -18 32 L -28 32 Z" fill="url(#goldGrad)" />
    <!-- Overlapping main strokes creating the distinctive geometric W -->
    <path d="M -22 -42 L 0 32 L 10 32 L -10 -42 Z" fill="url(#goldGrad)" opacity="0.95" />
    <path d="M 22 -42 L 0 32 L -10 32 L 10 -42 Z" fill="url(#goldGrad)" opacity="0.85" />
    <path d="M 60 -42 L 38 -42 L 18 32 L 28 32 Z" fill="url(#goldGrad)" />
    <!-- Cross apex accents -->
    <path d="M -42 -42 L -62 -42 L -62 -37 L -42 -37 Z" fill="url(#goldGrad)" />
    <path d="M 62 -42 L 42 -42 L 42 -37 L 62 -37 Z" fill="url(#goldGrad)" />
  </g>

  <!-- WILLIANS INVEST -->
  <text x="300" y="152" 
        text-anchor="middle" 
        fill="url(#goldGrad)" 
        font-family="'Playfair Display', 'Cinzel', 'Cinzel Decorative', 'Georgia', serif" 
        font-size="34" 
        font-weight="700" 
        letter-spacing="5">
    WILLIANS INVEST
  </text>

  <!-- Tagline with lines -->
  <g transform="translate(300, 185)">
    <!-- Left line -->
    <line x1="-240" y1="-5" x2="-130" y2="-5" stroke="url(#lineGradLeft)" stroke-width="1.2" />
    <!-- Center text -->
    <text x="0" y="0" 
          text-anchor="middle" 
          fill="#D4AF37" 
          font-family="'Montserrat', 'Inter', 'Segoe UI', sans-serif" 
          font-size="12.5" 
          font-weight="500" 
          letter-spacing="4.5">
      NEGÓCIOS EM PRECATÓRIOS
    </text>
    <!-- Right line -->
    <line x1="130" y1="-5" x2="240" y2="-5" stroke="url(#lineGradRight)" stroke-width="1.2" />
  </g>
</svg>
