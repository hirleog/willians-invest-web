<nav
  id="nav"
  [ngClass]="{ hidden: scrolled, 'nav-scrolled': scrolled }"
  class="navbar navbar-expand-lg"
>
  <div class="container d-flex align-items-center justify-content-between">
    <!-- Brand / Logo -->
    <a href="#home" class="navbar-brand d-flex align-items-center py-1">
      <img
        src="../../../assets/logo-gold.png"
        alt="Willians Invest - Negócios em Precatórios"
        class="nav-logo"
      />
    </a>

    <!-- Hamburger icon for mobile -->
    <div id="burger" *ngIf="isDashboard === false" class="d-lg-none">
      <button class="burger-btn" (click)="menu()" aria-label="Abrir Menu">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>

    <!-- Desktop Navigation Links -->
    <div *ngIf="isDashboard === false" class="hide-menu d-none d-lg-flex align-items-center">
      <ul class="navbar-nav me-4 mb-0 d-flex flex-row align-items-center gap-3">
        <li class="nav-item">
          <a class="nav-link" href="#home">Início</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#services">Serviços</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#checklist">Documentos</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#about">Sobre Nós</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#questions">FAQ</a>
        </li>
      </ul>

      <!-- CTA Button in Navbar -->
      <a href="#form" class="btn btn-sm btn-gold nav-cta-btn">
        <i class="fa-solid fa-calculator me-1"></i> Consultar Grátis
      </a>
    </div>
  </div>
</nav>

<!-- Mobile Sidebar Drawer -->
<div class="side-bar" *ngIf="openClose">
  <div class="d-flex justify-content-between align-items-center mb-4 px-3">
    <img
      src="../../../assets/logo-gold.png"
      alt="Willians Invest"
      style="height: 40px; width: auto;"
    />
    <button class="close-btn" (click)="menu()" aria-label="Fechar Menu">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>
  <ul class="navbar-nav px-3">
    <li class="side-item">
      <a (click)="menu()" class="nav-link" href="#home">Início</a>
    </li>
    <li class="side-item">
      <a (click)="menu()" class="nav-link" href="#services">Serviços</a>
    </li>
    <li class="side-item">
      <a (click)="menu()" class="nav-link" href="#checklist">Documentos Necessários</a>
    </li>
    <li class="side-item">
      <a (click)="menu()" class="nav-link" href="#about">Sobre a Willians Invest</a>
    </li>
    <li class="side-item">
      <a (click)="menu()" class="nav-link" href="#questions">Dúvidas Frequentes</a>
    </li>
    <li class="side-item mt-3">
      <a (click)="menu()" class="btn btn-gold w-100 text-center" href="#form">
        Consultar Precatório
      </a>
    </li>
  </ul>
</div>
