name: Deploy Automático

on:
  push:
    branches: ["master"]
    paths:
      - "**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install --force

      - name: Build project
        run: npm run build -- --configuration=production

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY || secrets.TUDU_PROFESSIONAL_SSH_KEY || secrets.TUDU_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo -e "Host 89.116.73.70\n  HostKeyAlgorithms ssh-ed25519,rsa-sha2-512\n  KexAlgorithms curve25519-sha256\n  Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com" >> ~/.ssh/config
          ssh-keyscan -t ed25519,rsa-sha2-512 89.116.73.70 >> ~/.ssh/known_hosts

      - name: Enviar arquivos via SCP
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r dist/willians-invest/* deployer@89.116.73.70:/var/www/projects/frontend/willians-invest-web/dist/willians-invest/

      - name: Fix permissions e reload Nginx
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no deployer@89.116.73.70 "sudo chown -R www-data:www-data /var/www/projects/frontend/willians-invest-web/dist/willians-invest && sudo chmod -R 775 /var/www/projects/frontend/willians-invest-web/dist/willians-invest && sudo systemctl reload nginx"
